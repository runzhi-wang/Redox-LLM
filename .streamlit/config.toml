[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[runner]
fastReruns = false
enforceSerializableSessionState = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
primaryColor = "#0d9488"
backgroundColor = "#fafcff"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
