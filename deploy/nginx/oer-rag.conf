# OER RAG reverse proxy — copy to deploy/nginx/oer-rag.conf and adjust server_name.
#
# Optional HTTP basic auth (uncomment auth_* lines after creating .htpasswd):
#   apt install apache2-utils && htpasswd -c deploy/nginx/.htpasswd youruser

upstream streamlit_oer_rag {
    server oer-rag:8501;
}

server {
    listen 80;
    server_name _;  # replace with your.domain.com

    client_max_body_size 10m;

    # auth_basic "OER RAG Team";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://streamlit_oer_rag;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
